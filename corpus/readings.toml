[[readings]]
principle = "thesis:categories"
work = "arrhenius-2000-thesis"
printed_page = "152–155"
name = "10.2 The Basic Structure"
excerpt = "A population is a finite set of lives in a possible world (for other constraints on possible populations, see section 2.3). We shall assume that for any natural number n and any welfare level X, there is a possible population of n people with welfare X (this is a generalisation of the No-Limit Assumption from section 3.1.3). Two populations are identical if and only if they consist of the same lives. [...] A population axiology is an \"at least as good as\" quasi-ordering of all possible populations, that is, a reflexive, transitive, but not necessarily complete ordering of populations in regard to their goodness (see chapter 2). A, B, C,… A1, A2,…, An, A∪B, and so on, denote populations of finite size. The number of lives in a population X (X's population size) is given by the function N(X). We shall adopt the convention that populations represented by different letters, or the same letter but different indexes, are pairwise disjoint. The relation \"has at least as high welfare as\" quasi-orders (reflexive, transitive, but not necessarily complete) the set 𝓛 of all possible lives. [...] We shall say that a life has neutral welfare if and only if it has the same welfare as a life without any good or bad welfare-components, and that a life has positive (negative) welfare if and only if it has higher (lower) welfare than a life with neutral welfare. By a welfare level 𝔸 we shall mean a set such that if a life a is in 𝔸, then a life b is in 𝔸 if and only if b has the same welfare as a. In other words, a welfare level is an equivalence class on 𝓛. Let a* be a life which is representative of the welfare level 𝔸. We shall say that a welfare level 𝔸 is higher (lower, the same) than (as) a level 𝔹 if and only if a* has higher (lower, the same) welfare than (as) b*; that a welfare level 𝔸 is positive (negative, neutral) if and only if a* has positive (negative, neutral) welfare; and that a life b has welfare below (above, at) 𝔸 if and only if b has higher (lower, the same) welfare than (as) a*. [...] Discreteness: For any pair of welfare levels 𝕏 and 𝕐, 𝕏 higher than 𝕐, the set consisting of all welfare levels ℤ such that 𝕏 is higher than ℤ, and ℤ is higher than 𝕐, has a finite number of members. [...] Let 𝕎1, 𝕎2, 𝕎3,… and so forth represent positive welfare levels, starting with one of the positive welfare level for which there is no lower positive one, such that for any pair of welfare levels 𝕎n and 𝕎n+1, 𝕎n+1 is higher than 𝕎n, and there is no welfare level 𝕏 such that 𝕎n+1 is higher than 𝕏, and 𝕏 is higher than 𝕎n. Analogously, let 𝕎-1, 𝕎-2, 𝕎-3,… and so on represent negative welfare levels. The neutral welfare level is represented by 𝕎0. A welfare range ℝ(x, y) is a union of at least three welfare levels defined by two welfare levels 𝕎x and 𝕎y, x < y, such that for any welfare level 𝕎z, 𝕎z is a subset of ℝ(x, y) if and only if x ≤ z ≤ y. We shall say that a welfare range ℝ(x, y) is higher (lower) than another range ℝ(z, w) if and only if x > w (y < z); that a welfare range ℝ(x, y) is positive (negative) if and only if x > 0 (y < 0); and that a life p has welfare above (below, in) ℝ(x, y) if and only if p is in some 𝕎z such that z > y (z < x, y ≥ z ≥ x)."
formal_reading = "n/a (definitions). Existence assumption: ∀n ∈ ℕ ∀ welfare level X ∃ population of n people with welfare X. :: n/a ⟹ n/a"
deviations = "Not encoded."
reader = "agent:read-a-thesis1"
cross_reader = "agent:read-b-thesis1"
cross_verdict = "agree"
review_state = "agent-cross-read"
relation = "other: definitions and background assumptions. The axiology ⪰ is a reflexive, transitive, possibly incomplete quasi-order on populations. Welfare comparison of lives is a quasi-order on 𝓛."
informal_excerpt = "Footnote 3 (p. 155): The reason for restricting welfare ranges to unions of at least three welfare levels, as opposed to at least two welfare levels, is that this restriction allows us to simplify the exact statements of the adequacy conditions. p. 156–157: In chapter 2, we claimed that concepts such as \"very high positive welfare\", \"very low positive welfare\", \"slightly negative welfare\", and the like are not essential for our discussion and results. [...] in the exact formulation of the Quality Condition, we have eliminated the concepts \"very low positive welfare\" and \"very high positive welfare\" and replaced them with two non-fixed positive welfare ranges, one starting at the lowest positive welfare level, and the other one starting anywhere above the first range. p. 153: if 𝔸 and 𝔹 are two consecutive welfare levels, 𝔸 higher than 𝔹, then 𝔸 is just slightly higher than 𝔹."
empty_allowed = "Unstated. 'Any natural number n' may include 0. Populations are finite sets of lives, and nothing excludes the empty set. The pairwise-disjointness convention is trivially compatible with empty populations."
notation = "𝓛 = set of all possible lives. Outline letters (𝔸, 𝔹, ℂ, 𝕏, 𝕐, ℤ, 𝕎n) are welfare levels, i.e. equivalence classes of equally good lives. Plain letters (A, B, C, ...) are populations. N(X) = number of lives in X. Different letters or indexes denote pairwise disjoint populations. 𝕎1, 𝕎2, ... is a consecutive chain of positive levels starting at a lowest positive level. 𝕎0 = neutral. 𝕎-1, 𝕎-2, ... = negative levels. ℝ(x,y) = the union of 𝕎z for x ≤ z ≤ y, with at least three levels. A range is positive iff x > 0. 'Very low positive welfare' becomes a range ℝ(1, y). 'Very high' becomes a range ℝ(u, v) with u > y. 'Slightly lower' becomes consecutive indexes. Later statements write 'A⊂𝕎x' to mean every life in A is at level 𝕎x."
existentials = ["for any n and any level X, a population of n lives at X exists (generalised No-Limit Assumption)", "at least one positive level with no lower positive level (said to follow from Discreteness, a neutral level and the quasi-ordering)"]
ambiguities = ["A: Printed error: the text defines 'a life b has welfare below (above, at) 𝔸 if and only if b has higher (lower, the same) welfare than (as) a*'. Read literally, 'below' means higher and 'above' means lower. The intended reading is surely the reverse. The literal reading inverts the Egalitarian Dominance and Dominance Addition exact formulations.", "A: Because lives are only quasi-ordered, several lowest positive levels may exist (fn. 2). The integer chain 𝕎n is one chosen chain, 'starting with one of' them. The text does not say that every welfare level is indexed. Levels incomparable with the chain may exist, and a life may be 'below 𝕎x' without lying at any indexed level.", "A: Whether the chain continues without bound is not asserted. The text says only that Discreteness 'doesn't exclude' a higher level for every level. The proofs use 𝕎v, 𝕎u and similar levels, whose existence comes from the ranges given by the Quality Condition.", "A: The '⊂' symbol reads naturally as 'all members of A lie at level 𝕎x' (A is a subset of the level). Proper versus non-proper subset is irrelevant here. It is unstated whether A⊂𝕎x with N(A)=0 (the empty population) is intended.", "A: 'At least three welfare levels' combined with x < y implies y ≥ x+2. The proofs use this: y > 1 on p. 158 and y > 2 on p. 161.", "A: The text says Discreteness holds of 𝓛 'or some subset of 𝓛'. Under Denseness the theorems are claimed for a discrete subset 𝓛1.", "B: The printed definition reads 'a life b has welfare below (above, at) A if and only if b has higher (lower, the same) welfare than (as) a*'. Taken literally, 'below' means higher than a*. This is almost certainly a typo for lower (higher, the same). The proofs rely on the intuitive reading, e.g. Theorem 1 step (8) uses 'A_{r+1} ⊂ W1 and y > 1' to satisfy 'all members ... have welfare below Wy'.", "B: Life-to-range 'above/below/in' is defined only for lives lying in some indexed W_z. Lives at levels incomparable with, or outside, the indexed chain are neither above nor below a range.", "B: Because welfare is only quasi-ordered, several positive levels may lack a lower positive level (fn 2). The indexing starts from 'one of' them, and the text does not say whether every level is indexed. With incomparable levels, the chain W1, W2, ... does not cover L.", "B: '⊂' is printed throughout. It could mean proper or non-proper subset. Welfare levels are presumably infinite (No-Limit), so the difference rarely matters, but ⊂ does not exclude an empty population.", "B: 'Perfectly equal' gets no formal definition in chapter 10. It is expressed only through A⊂Wx.", "B: 'Slightly negative welfare' is mentioned as eliminable. In these items it is not formalised; in the Non-Extreme Priority Condition it becomes an arbitrary Wy with y < 0, with no restriction to y = -1.", "B: The pairwise-disjointness convention for differently lettered populations does not stop empty populations from appearing, because empty sets are disjoint from everything.", "B: Theorem 2 step 11 applies the Quality Condition to the bottom range R(1, y) (see thesis:theorem-2). This implies R(1, y) is the whole bottom segment W1..Wy of positive levels."]

