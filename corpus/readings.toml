[[readings]]
principle = "arrhenius-2009:categories"
work = "arrhenius-2009-one-more"
printed_page = "25-28 (also footnote 2, p. 23; p. 30 remark on eliminated concepts)"
name = "2. The Basic Structure"
excerpt = "A population is a finite set of lives in a possible world. We shall assume that for any natural number n and any welfare level X, there is a possible population of n people with welfare X. [...] A population axiology is an “at least as good as” quasi-ordering of all possible populations, that is, a reflexive, transitive, but not necessarily complete ordering of populations in regard to their goodness. A, B, C,… A1, A2,…, An, A∪B, and so on, denote populations of finite size. The number of lives in a population X (X’s population size) is given by the function N(X). We shall adopt the convention that populations represented by different letters, or the same letter but different indexes, are pairwise disjoint. For example, A∩B = A1∩A2 = ∅. [...] We shall say that a life has neutral welfare if and only if it is equally good for the person living it as a neutral welfare component, and that a life has positive (negative) welfare if and only if it has higher (lower) welfare than a life with neutral welfare. By a welfare level A we shall mean a set such that if a life a is in A, then a life b is in A if and only if b has the same welfare as a. In other words, a welfare level is an equivalence class on L. [...] Discreteness: For any pair of welfare levels X and Y, X higher than Y, the set consisting of all welfare levels Z such that X is higher than Z, and Z is higher than Y, has a finite number of members. [...] Let W1, W2, W3,… and so forth represent positive welfare levels, starting with one of the positive welfare level for which there is no lower positive one, such that for any pair of welfare levels Wn and Wn+1, Wn+1 is higher than Wn, and there is no welfare level X such that Wn+1 is higher than X, and X is higher than Wn. Analogously, let W-1, W-2, W-3,… and so on represent negative welfare levels. The neutral welfare level is represented by W0. A welfare range R(x, y) is a union of at least three welfare levels defined by two welfare levels Wx and Wy, x < y, such that for any welfare level Wz, Wz is a subset of R(x, y) if and only if x ≤ z ≤ y. We shall say that a welfare range R(x, y) is higher (lower) than another range R(z, w) if and only if x > w (y < z); that a welfare range R(x, y) is positive (negative) if and only if x > 0 (y < 0); and that a life p has welfare above (below, in) R(x, y) if and only if p is in some Wz such that z > y (z < x, y ≥ z ≥ x)."
formal_reading = "n/a (definitions) :: n/a ⟹ n/a"
deviations = "Not encoded."
reader = "agent:read-a-2009"
cross_reader = "agent:read-b-2009"
cross_verdict = "agree"
review_state = "agent-cross-read"
relation = "other: definitions and notation"
informal_excerpt = "Footnote 2 (p. 23): Expressions such as “a population with very high positive welfare”, “a population with very low positive welfare”, etc., are elliptical for the more cumbersome phrases “a population consisting only of lives with very high positive welfare”, “a population consisting only of lives with very low positive welfare”, etc. — p. 27: if A and B are two consecutive welfare levels, A higher than B, then A is just slightly higher than B. — p. 30: Notice that in the exact formulation of the adequacy conditions, we have eliminated concepts such as “very high positive welfare”, “very low positive welfare”, “very negative welfare”, and the like. [...] in the exact formulation of the Weak Quality Addition Condition, we have eliminated the concepts “very low positive welfare” and “very high positive welfare” and replaced them with two non-fixed positive welfare ranges, one starting at the lowest positive welfare level, and the other one starting anywhere above the first range."
empty_allowed = "Unstated. 'For any natural number n' may include n = 0. The example A∩B = ∅ shows only disjointness."
notation = "N(X) = number of lives in X; A∪B = union; distinct letters or indexes denote pairwise disjoint populations; Wn = n-th positive level (W1 is a lowest positive level), W-n = negative levels, W0 = neutral; consecutive indexes mean no level lies between; R(x, y) = union of the levels Wz with x ≤ z ≤ y, at least three levels, x < y; 'A⊂Wx' (used throughout the exact formulations) = every life in A is at level Wx, so A is perfectly equal; slightly higher = consecutive levels; very high/very low/very negative are eliminated in the exact formulations in favour of existentially chosen levels and ranges. 'Perfectly equal' has no formal definition; the exact formulations express it as A⊂Wx."
