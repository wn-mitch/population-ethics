[[readings]]
principle = "arrhenius-2000-ep:categories"
work = "arrhenius-2000-ep"
printed_page = "260 (also 249, 257 fn 19, 260 fn 26–28)"
name = "(untitled formal preliminaries, Section 5 'Preconditions of the Impossibility Theorem'; definitions of positive/negative/neutral welfare in Section 2)"
excerpt = "A population is a finite set of possible lives. A life is individuated by the person whose life it is and the kind of life it is, and two populations are identical if and only if they consist of the same lives. A population is a set of lives under the restriction that one and the same person only occurs once in one and the same population. Unions of populations are also populations given that the aforementioned restriction is satisfied. Let A, B, C, A∪B, and so on, denote populations. The number of lives in a population – the population size – is denoted by a subscript. For example, A_p denotes a population with p members. Let a_i denote a member of population A, b_i a member of population B, and so forth. We shall assume that there are possible lives with positive or negative welfare. Furthermore, we shall assume that there are possible lives with very high positive welfare, very low positive welfare and slightly negative welfare. Let W_pw be the set of all lives with positive welfare, W_nw the set of all lives with negative welfare, W_vhp the set of all lives with very high positive welfare, W_vlp the set of all lives with very low positive welfare, and W_sn the set of all lives with slightly negative welfare. We shall also assume that there are lives of at least four different levels of welfare in W_vlp. The welfare statements above are all categorical, that is, of the general form 'a has such-and-such welfare'. We also need to make some comparative welfare statements such as 'a has higher (lower, the same) welfare as b'. We shall assume that lives with positive welfare can be ordered by the relation 'has at least as high welfare as' such that people's welfare can be numerically represented in a manner that allows us to compare gains and losses of welfare. The numerical representation of a life a_i's welfare is given by the function v(a_i)."
formal_reading = "n/a (definitions). Existence assumptions: ∃ lives in W_pw, W_nw, W_vhp, W_vlp, W_sn; ∃ at least four distinct welfare levels in W_vlp. :: n/a ⟹ n/a"
deviations = "Not encoded."
reader = "agent:read-a-2000ep"
cross_reader = "agent:read-b-2000ep"
cross_verdict = "agree"
review_state = "agent-cross-read"
relation = "other: definitions; the axiology is a reflexive, transitive, complete 'at least as good as' ordering (fn 19); 'better than'/'worse than' are its strict part."
informal_excerpt = "p. 249: \"We shall say that a life has neutral welfare if and only if it has the same welfare as a life without any good or bad welfare components, and that a life has positive (negative) welfare if and only if it has higher (lower) welfare than a life with neutral welfare.\" p. 257: \"We shall understand a welfarist axiology as an 'at least as good as' ordering of all logically possible populations, solely based on people's welfare.\" fn 19 (p. 257): \"we assume that the relation '_ is at least as good as _' should be reflexive, transitive and complete over the set of all logically possible populations.\" fn 26 (p. 260): \"Notice also that we are not assuming that the above partitions of possible lives are exhaustive. There might, of course, be lives with neutral welfare but also some peculiar lives that cannot be grouped into any of these sets.\" fn 27 (p. 260): \"From the categorical statements above some comparative statements follow conceptually. If John has positive and Chandra has negative welfare, then John has higher welfare than Chandra; if John has very high and Chandra has very low positive welfare, then John has higher welfare than Chandra and so forth. Notice that we have not assumed that lives belonging to the same welfare partition have the same level of welfare.\" fn 28: comparisons of gains and losses \"presuppose measurement on a scale at least as strong as an interval scale\"."
empty_allowed = "Unstated in general. A population is 'a finite set of possible lives', which does not exclude the empty set. Size 0 appears explicitly only via 'k ≥ 0' in MNEP and the Sadistic Conclusion."
notation = "A_p = population with p members (subscript = size); a_i = member of A; A∪B = union, a population only if no person occurs twice; W_pw = positive-welfare lives; W_nw = negative-welfare lives; W_vhp = very high positive; W_vlp = very low positive; W_sn = slightly negative; v(a_i) = numerical welfare of a_i; A'_q (prime) is used in the proof for a second very-high population. 'Perfectly equal' is not defined as a term; the formal conditions express it as 'a_i has the same welfare as a_j for all a_i, a_j ∈ A_n'."
existentials = ["possible lives in each of W_pw, W_nw, W_vhp, W_vlp, W_sn", "at least four distinct welfare levels within W_vlp"]
ambiguities = ["A: Containments between the sets are not stated. W_vhp ⊆ W_pw, W_vlp ⊆ W_pw and W_sn ⊆ W_nw follow only from the category names. The Sadistic Conclusion step in the proof depends on them (E_1 slightly negative treated as in W_nw; F_m very low positive treated as in W_pw).", "A: Cross-category comparisons are asserted only conceptually and partially (fn 27: positive > negative, very high > very low positive, 'and so forth'). The text does not say whether categories are bounded bands, or how 'slightly' negative a W_sn life is.", "A: Lives in one category need not share a welfare level (fn 26/27), so 'A_n ⊂ W_vhp' does not imply equality within A_n.", "A: Union: sizes add only if populations are disjoint. The text does not say whether A∪B presupposes disjointness; the proof assumes sizes add (e.g. |A_p∪C_{m+q}| = m+p+q).", "A: Whether the ordering ranges over the empty population is unstated.", "A: The proof needs an unbounded supply of distinct lives at a fixed welfare level (arbitrarily large F_m, D_{m+p+q}, G_{m+p+q}). This is not stated as an assumption.", "A: The numerical representation is asserted for 'lives with positive welfare' (p. 260), but the Anti-Egalitarian Conclusion as stated applies v to arbitrary populations.", "B: Numerical representation is asserted for 'lives with positive welfare' only, yet the Anti-Egalitarian Conclusion's averages are stated for arbitrary populations. Unclear whether v is defined on negative lives.", "B: W_sn vs W_nw: slightly negative lives are presumably a subset of W_nw, but the text never states W_sn ⊆ W_nw. Likewise W_vhp, W_vlp ⊆ W_pw is implied only by the words 'positive welfare'.", "B: The ordering between W_sn lives and very low positive lives follows only via positive > negative (fn 27). The text gives no bound on how far below neutral 'slightly' negative is.", "B: The categories are not exhaustive (fn 26). Lives may exist that belong to none of them, e.g. neutral lives or positive lives that are neither very high nor very low.", "B: Within a category, welfare levels may differ (fn 27). Whether there is a gap between W_vlp and W_vhp, or intermediate positive lives, is unstated.", "B: The text never defines 'perfectly equal' in words; formal clauses use 'a_i has the same welfare as a_j for all a_i, a_j'.", "B: Scale strength: fn 28 says interval scale at least; ratio-scale status is left open."]

