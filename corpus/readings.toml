[[readings]]
principle = "arrhenius-2000-thesis:categories"
work = "arrhenius-2000-thesis"
printed_page = "152–155"
name = "10.2 The Basic Structure (definitions)"
excerpt = "A population is a finite set of lives in a possible world […] We shall assume that for any natural number n and any welfare level X, there is a possible population of n people with welfare X […] A population axiology is an \"at least as good as\" quasi-ordering of all possible populations, that is, a reflexive, transitive, but not necessarily complete ordering of populations in regard to their goodness […] A, B, C,… A_1, A_2,…, A_n, A∪B, and so on, denote populations of finite size. The number of lives in a population X (X's population size) is given by the function N(X). We shall adopt the convention that populations represented by different letters, or the same letter but different indexes, are pairwise disjoint. […] We shall say that a life has neutral welfare if and only if it has the same welfare as a life without any good or bad welfare-components, and that a life has positive (negative) welfare if and only if it has higher (lower) welfare than a life with neutral welfare. By a welfare level A we shall mean a set such that if a life a is in A, then a life b is in A if and only if b has the same welfare as a. […] Discreteness: For any pair of welfare levels X and Y, X higher than Y, the set consisting of all welfare levels Z such that X is higher than Z, and Z is higher than Y, has a finite number of members. […] Let W_1, W_2, W_3,… and so forth represent positive welfare levels, starting with one of the positive welfare level for which there is no lower positive one, such that for any pair of welfare levels W_n and W_{n+1}, W_{n+1} is higher than W_n, and there is no welfare level X such that W_{n+1} is higher than X, and X is higher than W_n. Analogously, let W_{-1}, W_{-2}, W_{-3},… and so on represent negative welfare levels. The neutral welfare level is represented by W_0. A welfare range R(x, y) is a union of at least three welfare levels defined by two welfare levels W_x and W_y, x < y, such that for any welfare level W_z, W_z is a subset of R(x, y) if and only if x ≤ z ≤ y. We shall say that a welfare range R(x, y) is higher (lower) than another range R(z, w) if and only if x > w (y < z); that a welfare range R(x, y) is positive (negative) if and only if x > 0 (y < 0); and that a life p has welfare above (below, in) R(x, y) if and only if p is in some W_z such that z > y (z < x, y ≥ z ≥ x)."
formal_reading = " ::  ⟹ "
deviations = "Not encoded."
reader = "agent:read-a-thesis2"
cross_reader = "agent:read-b-thesis2"
cross_verdict = "agree"
review_state = "agent-cross-read"
relation = "other: definitions"
informal_excerpt = "In chapter 2, we claimed that concepts such as \"very high positive welfare\", \"very low positive welfare\", \"slightly negative welfare\", and the like are not essential for our discussion and results. […] in the exact formulation of the Quality Condition, we have eliminated the concepts \"very low positive welfare\" and \"very high positive welfare\" and replaced them with two non-fixed positive welfare ranges, one starting at the lowest positive welfare level, and the other one starting anywhere above the first range. (pp.156–157) We have generalised the Weak Quality Addition Condition and the Non-Extreme Priority Condition in the same way […] we have eliminated the concepts \"very high positive\", \"very low positive\", and \"slightly negative welfare\". (p.162)"
empty_allowed = "Pairwise disjointness is stipulated for differently lettered or indexed populations. The proofs explicitly use ∅ as a population (e.g. A_{n+1}=∅), so the empty population is admitted as a population."
notation = "'Perfectly equal' is not defined formally in ch. 10. The exact conditions replace it with A⊂W_x (all lives at one level). 'Very high' → a range R(x,w) or a level threshold; 'very low positive' → R(1,y); 'slightly negative' → an existentially chosen W_y, y<0; 'slightly higher' → consecutive levels (W_x vs W_{x-1}, W_z vs W_{z+1}). ⊂ is used for 'is a subset of' (a population of lives at a level, a level within a range)."
ambiguities = ["A: The indexing assumes a single chain of levels, but lives are only quasi-ordered (fn. 2, p.155: there might be more than one lowest positive level). The W_i chain picks 'one of' them. Incomparable levels outside the chain are not indexed.", "A: A range R(x,y) is defined as higher than R(z,w) iff x > w, and lower iff y < z (the parenthetical in the source).", "A: 'Better' for populations is not given its own definition in ch. 10. The life-level analogue (p.153) is the strict part of 'at least as high welfare as'. By analogy, 'better' = ⪰ and not ⪯, and 'worse' is its converse.", "B: Footnote 2: welfare is only quasi-ordered, so there may be several positive levels with no lower positive one, and levels incommensurable with the W_i chain. The indexing picks one chain; ranges and conditions are stated only for levels on it.", "B: The printed subset symbol is ⊂. It is used as non-strict subset admitting ∅ (D=∅ case of β; A_{n+1}=∅ inside unions claimed ⊂R(y, x)).", "B: The range 'above (below, in)' clause is printed as 'z > y (z < x, y ≥ z ≥ x)'.", "B: 'Other things being equal', appended to every condition, is not defined in ch. 10.", "B: The Discreteness assumption is stated for L 'or some subset of L'; p. 154 argues that if Denseness holds, the theorems apply to a discrete subset L_1."]

[[readings]]
principle = "arrhenius-2003:categories"
work = "arrhenius-2003-vrc"
printed_page = "169-171"
name = "2. The Basic Structure (definitions, notation, Discreteness, welfare levels and ranges)"
excerpt = "A life is individuated by the person whose life it is and the kind of life it is. A population is a finite set of lives in a possible world. We shall assume that for any natural number n and any welfare level X, there is a possible population of n people with welfare X. [...] A population axiology is an “at least as good as” quasi-ordering of all possible populations, that is, a reflexive, transitive, but not necessarily complete ordering of populations in regard to their goodness. A, B, C,… A1, A2,…, An, A∪B, and so on, denote populations of finite size. The number of lives in a population X (X’s population size) is given by the function N(X). We shall adopt the convention that populations represented by different letters, or the same letter but different indexes, are pairwise disjoint. The relation “has at least as high welfare as” quasi-orders (reflexive, transitive, but not necessarily complete) the set 𝓛 of all possible lives. [...] We shall say that a life has neutral welfare if and only if it has the same welfare as a life without any good or bad welfare-components, and that a life has positive (negative) welfare if and only if it has higher (lower) welfare than a life with neutral welfare. By a welfare level A we shall mean a set such that if a life a is in A, then a life b is in A if and only if b has the same welfare as a. In other words, a welfare level is an equivalence class on 𝓛. [...] that a welfare level A is positive (negative, neutral) if and only if a* has positive (negative, neutral) welfare; and that a life b has welfare below (above, at) A if and only if b has higher (lower, the same) welfare than (as) a*. [p.170] Discreteness: For any pair of welfare levels X and Y, X higher than Y, the set consisting of all welfare levels Z such that X is higher than Z, and Z is higher than Y, has a finite number of members. [...] Let 𝕎1, 𝕎2, 𝕎3,… and so forth represent positive welfare levels, starting with one of the positive welfare level for which there is no lower positive one, such that for any pair of welfare levels 𝕎n and 𝕎n+1, 𝕎n+1 is higher than 𝕎n, and there is no welfare level X such that 𝕎n+1 is higher than X, and X is higher than 𝕎n. Analogously, let 𝕎-1, 𝕎-2, 𝕎-3,… and so on represent negative welfare levels. The neutral welfare level is represented by 𝕎0. A welfare range ℝ(x, y) is a union of at least three welfare levels defined by two welfare levels 𝕎x and 𝕎y, x < y, such that for any welfare level 𝕎z, 𝕎z is a subset of ℝ(x, y) if and only if x ≤ z ≤ y. We shall say that a welfare range ℝ(x, y) is higher (lower) than another range ℝ(z, w) if and only if x > w (y < z); that a welfare range ℝ(x, y) is positive (negative) if and only if x > 0 (y < 0); and [p.171] that a life p has welfare above (below, in) ℝ(x, y) if and only if p is in some 𝕎z such that z > y (z < x, y ≥ z ≥ x). A welfare range ℝ(x, Ω) is a union of all the welfare levels 𝕎i, i ≥ x, and a welfare range ℝ(Ω, y) is a union of all the welfare levels 𝕎i, i ≤ y."
formal_reading = "n/a (definitions) :: n/a ⟹ n/a"
deviations = "Not encoded."
reader = "agent:read-a-2003"
cross_reader = "agent:read-b-2003"
cross_verdict = "agree"
review_state = "agent-cross-read"
relation = "other: definitions"
informal_excerpt = "[p.172] Notice that in the exact formulation of the adequacy conditions, we have eliminated concepts such as “very high positive welfare”, “very low positive welfare”, “very negative welfare”, and the like. [...] in the exact formulation of Avoidance of the Very Repugnant Conclusion, we have eliminated the concepts “very low positive welfare” and “very high positive welfare” and replaced them with two non-fixed positive welfare ranges, one starting at the lowest positive welfare level, and the other one starting anywhere above the first range. [p.170] In the exact statements of those adequacy conditions, we shall instead make use of two consecutive welfare levels, that is, two welfare levels such that there is no welfare level in between them. [...] if A and B are two consecutive welfare levels, A higher than B, then A is just slightly higher than B."
empty_allowed = "Populations are 'finite set[s] of lives'; the empty set is not explicitly excluded, and the proofs use ∅ as a population (Lemma 1.1 (4)-(6), Lemma 1.2 (7))."
notation = "𝓛 = set of all possible lives; 𝕎i = i-th welfare level, 𝕎0 neutral, 𝕎i (i>0) positive, 𝕎i (i<0) negative, consecutive indices = consecutive levels ('slightly higher'); ℝ(x,y) = union of levels 𝕎z with x ≤ z ≤ y, at least three levels (so y ≥ x+2); ℝ(x,Ω) = ∪ 𝕎i, i ≥ x; ℝ(Ω,y) = ∪ 𝕎i, i ≤ y; range positive iff x > 0, negative iff y < 0; N(X) = number of lives in X; different letters or indices = pairwise disjoint populations; '⊂' (as printed) relates a population to a level or range; 'perfectly equal population' in the exact forms is rendered as A⊂𝕎x (all lives at one level); 'very high/very low/very negative' are eliminated in favor of existentially chosen levels/ranges; 'at least as good as' is a quasi-ordering; 'better than' is not defined explicitly."
existentials = ["for any natural number n and welfare level X, a possible population of n people with welfare X exists (assumption)"]
ambiguities = ["A: 'A life b has welfare below (above, at) A iff b has higher (lower, the same) welfare than (as) a*' reads as inverted (below ↔ higher). Probably a typo, but the text says this.", "A: '⊂' is printed throughout, and the text never says whether it means proper or non-proper subset. Applied to a population inside a welfare level or range, it presumably means ⊆.", "A: Whether ∅ counts as a population is not stated in the definitions. The proofs treat it as one.", "A: 'Better than' is never defined. Presumably it is the asymmetric part of 'at least as good as'.", "A: Levels are indexed along one chain starting from 'one of' the lowest positive levels (fn 7: incommensurable levels may exist). The indexing of the other levels, and how they relate to 𝕎i, is not stated.", "A: Welfare range requires 'at least three' levels, so ℝ(1,y) implies y ≥ 3. It is not stated whether ℝ(x,Ω) and ℝ(Ω,y) fall under the three-level requirement (they are infinite or open unions).", "A: The source does not define 'perfectly equal' formally. The exact formulations encode it only through A⊂𝕎x.", "A: The Discreteness assumption is said to hold of '𝓛 or some subset of 𝓛'. Its scope is unspecified.", "B: 'Perfectly equal population' is used in the informal conditions but never defined; the exact formulations replace it with A ⊂ W_x (all lives at a single welfare level).", "B: 'Very high positive', 'very low positive' and 'very negative' welfare are not defined; the text says the exact formulations eliminate them (p. 172).", "B: The symbol ⊂ is used throughout (A⊂W_x, B⊂R(1,y)). Read literally it is proper subset; context indicates it means 'is a subset of' (⊆), i.e. every life of the population lies at that level/range. Whether an empty population counts as ⊂ W_x is unstated.", "B: Footnote 7: there may be more than one positive level with no lower positive level, because lives are only quasi-ordered (incommensurability). The W_i indexing picks one chain 'starting with one of' them; whether levels off the chain exist and how conditions treat them is unstated.", "B: The strict relation 'better than' on populations is never defined explicitly for populations; only for lives (higher welfare = at least as high and not conversely). The proof treats 'better' as the strict part of 'at least as good as'.", "B: The 'at least three levels' restriction on R(x,y) implies y ≥ x+2; so R(1,y) implies y ≥ 3. Whether R(x,Ω) and R(Ω,y) are subject to the three-level restriction is unstated (they are unions of all levels above/below).", "B: Definition of 'life b has welfare below (above, at) 𝔸 iff b has higher (lower, the same) welfare than (as) a*' reads inverted as printed (below ↔ higher); transcribed as printed.", "B: Whether the natural numbers in the existence assumption include 0 is unstated.", "B: Discreteness is said to hold 'of the set of all possible lives 𝓛 or some subset of 𝓛'; which subset is intended is unstated."]

