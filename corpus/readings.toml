informal_excerpt = "Proof. We shall show that the contrary assumption leads to a contradiction. We shall make use of two lemmas to the effect that the Non-Elitism and the General Non-Extreme Priority Condition each imply another condition, Condition β and δ respectively. We shall first prove a lemma to the effect that Weak Quality Addition Condition and Condition δ implies what we shall call the Restricted Quality Addition Condition. We shall then show that there is no population axiology which satisfies this condition in conjunction with Condition β and δ, the Egalitarian Dominance, and the Weak Non-Sadism Condition. [...] (p. 36) It follows trivially from lemma 1-4 that the impossibility theorem is true. Q.E.D."
