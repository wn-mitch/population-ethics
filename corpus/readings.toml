nd r (MIA) depends on A_p∪A'_q; the populations are listed before r is defined, but C_{p+r-1} and F_r depend on r.", "B: The MIA step requires m > p + q; the proof states 'm > p + q', matching m > n with n = p + q.", "B: MIA step uses C = G at level vlp2, above F at vlp1, with no requirement that G lie below A — consistent with the formal statement.", "B: ED step: B_{q+1}∪C_{p+r-1} is perfectly equal only because both lie in W_vlp3 whose lives share one welfare level; sizes q+1 + p+r-1 = p+q+r match G.", "B: Strict conclusion 'G worse than A_p∪A'_q∪E_1' from a chain ⪰, ⪰, ≻ assumes mixed transitivity of weak and strict parts; 'better' is not formally defined.", "B: NS step requires W_vlp1 ⊆ W_pw and W_sn ⊆ W_nw (implicit)."]
