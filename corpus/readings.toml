review_state = "agent-cross-read"
relation = "other: definitions; axiology = quasi-ordering (reflexive, transitive, not necessarily complete) of 'is at least as good as'"
informal_excerpt = "fn 6 (p. 12): \"Examples of possible populations is Rysiek with very high welfare; Rysiek and Erik with very high welfare; and the empty set. An example of an invalid population is Rysiek with very high welfare and Rysiek with very low welfare, that is, a population cannot contain two or more of the same person's possible lives.\" fn 7 (p. 12): \"Strictly speaking, we only need to make the less general assumption that for any possible population with very low welfare, there is a larger possible population with the same welfare.\" fn 9 (p. 13): \"From the categorical statements above some comparative statements follow conceptually. If Rysiek has positive and Erik has negative welfare, then Rysiek has higher welfare than Erik; if Rysiek has very high and Erik has very low positive welfare, then Rysiek has higher welfare than Erik; and so forth. Notice that we have not assumed that lives belonging to the same welfare partition share the same level of welfare. It seems reasonable to assume that there are different levels of welfare among lives with, for example, very high positive welfare.\" Discussion (p. 19): \"The theorem is valid as long as lives with very low or very high positive welfare are ordered by the relation 'has at least as high welfare as'.\""
empty_allowed = "The empty set is explicitly a possible population (fn 6)."
notation = "W_pw = lives with positive welfare; W_nw = lives with negative welfare; W_vhp = very high positive; W_vlp = very low positive; W_sn = slightly negative; W_vlp1/2/3 = equal-welfare subsets of W_vlp ordered vlp1 < vlp2 < vlp3; subscript = population size; lower-case letters = members; ∪ = union of populations (valid only if no person occurs twice); ⊂ written for 'is a population drawn from' a category set."
existentials = ["possible lives with positive, negative, very high positive, very low positive, slightly negative welfare", "subsets of W_vhp and W_vlp ordered by 'has at least as high welfare as'", "W_vlp1, W_vlp2, W_vlp3 ⊂ W_vlp, each internally equal, vlp3 > vlp2 > vlp1", "for any possible population with a certain welfare, a larger possible population with the same welfare (fn 7: only needed for very low welfare)"]
ambiguities = ["A: The text never states W_vhp, W_vlp ⊂ W_pw or W_sn ⊂ W_nw; this follows only from the names ('very high positive', 'slightly negative'). The proof's Non-Sadism step needs W_vlp1 ⊂ W_pw and W_sn ⊂ W_nw.", "A: The text calls the categories 'partitions' but does not state they are pairwise disjoint (e.g. W_vhp ∩ W_vlp = ∅). fn 9 implies every vhp life has higher welfare than every vlp life, which forces disjointness.", "A: 'Better than' is never defined. Presumably it is the asymmetric part of 'at least as good as', but the text does not say so. The proof's final contradiction requires that 'X worse than Y' and 'X at least as good as Y' are incompatible.", "A: The symbol ⊂ could mean proper subset. In context it means 'is a set of lives drawn from'; strict properness plays no role.", "A: The text does not say whether members within W_vhp, W_sn or W_vlp generally are equal. Only W_vlp1/2/3 are stipulated internally equal. fn 9 denies that category membership implies equal welfare.", "A: The text does not state whether distinct named populations in a construction (e.g. A_p, A'_q) consist of distinct persons. Unions are defined only when no person repeats, so the proof implicitly requires disjoint persons.", "A: 'Other things being equal' appears in every condition but has no formal content.", "B: Inclusions W_vhp, W_vlp ⊆ W_pw and W_sn ⊆ W_nw are not stated explicitly; they follow only from the category names and fn. 9's 'and so forth'.", "B: fn. 9 ordering facts are given by example ('and so forth'); whether sn < vlp is stated only via 'positive > negative'.", "B: ⊂ could be read as proper subset or as ⊆; in context it means 'a population all of whose lives lie in'.", "B: 'better than' is never formally defined; presumably the strict (asymmetric) part of 'at least as good as'.", "B: 'Larger possible population with the same welfare': whether 'same welfare' means same level per life or same category is unclear; the proof needs same level (A'_q same welfare as A-lives).", "B: No equal-welfare subset of W_vhp is named, but the proof assumes A_p has members 'with the same very high welfare'.", "B: Lives of different populations in a union must belong to distinct persons; whether distinct 'possible lives' of distinct persons are always available is assumed, not stated."]

