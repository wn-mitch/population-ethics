name = "The Dominance Addition Condition"
excerpt = "The Dominance Addition Condition (exact formulation): For any populations A, B, and C, and any pair of welfare levels 𝕎x and 𝕎y, y > 0, if all the lives in A have welfare below 𝕎x, all the lives in B have welfare above or at 𝕎x, N(A)=N(B), and C⊂𝕎y, then B∪C is not worse than A, other things being equal."
formal_reading = "∀A ∀B ∀C ∀𝕎x ∀𝕎y with y > 0 :: every life in A below 𝕎x; every life in B above or at 𝕎x; N(A)=N(B); C⊂𝕎y; y > 0 ⟹ ¬(A ≻ B∪C)"
deviations = "Not encoded."
reader = "agent:read-a-thesis1"
cross_reader = "agent:read-b-thesis1"
cross_verdict = "agree"
review_state = "agent-cross-read"
relation = "not-strict"
informal_excerpt = "The Dominance Addition Condition: An addition of lives with positive welfare and an increase in the welfare in the rest of the population doesn't make a population worse, other things being equal."
empty_allowed = "Unstated for all three. N(C) is unconstrained, so C may be empty and the condition then compares B with A. A and B may apparently both be empty, which gives C not worse than ∅. None of this is excluded in the text."
notation = "𝕎x may be any level, not necessarily positive. 𝕎y is positive. A and B need not be perfectly equal. C is perfectly equal at 𝕎y. The condition replaces the Mere Addition Principle."
ambiguities = ["A: The consequent is 'not worse than', i.e. ¬(A ≻ B∪C), which is weaker than B∪C ⪰ A under an incomplete ordering. The proof (step 8 vs 13) uses exactly this negated-strict form.", "A: Whether C may be empty (N(C) is not constrained).", "A: 'Below' and 'above or at' follow §10.2, where 'below' and 'above' are printed inverted.", "A: The informal 'increase in the welfare in the rest of the population' is rendered as a same-size population B whose every life is at or above a threshold 𝕎x that every life of A is below. This is a threshold separation, not a one-to-one improvement.", "A: The requirement is on 'all the lives'. B is not required to be at a single level.", "B: 'Not worse' is weaker than 'at least as good as' under an incomplete ordering: it also allows incommensurability. The proof of Theorem 2 derives a contradiction from 'not worse' (8) against 'better' (13), which fits the reading ¬(A ≻ B∪C).", "B: The informal version speaks of an 'increase in the welfare in the rest of the population' (a pointwise increase of the same people). The exact form requires only a threshold separation: every B life at or above Wx, every A life below Wx, with equal sizes. This is stronger than pointwise improvement and needs no identity of persons.", "B: No sign restriction on Wx: the exact text allows A and B at negative levels.", "B: Only Wy is required to be positive. C must be perfectly equal (C ⊂ Wy), whereas the informal version allows any 'lives with positive welfare'.", "B: 'Below Wx' / 'above or at Wx' inherit the reversed-wording typo in 10.2 (see thesis:categories)."]

