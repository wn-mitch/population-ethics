excerpt = "Lemma 1: The Non-Elitism Condition implies Condition β: Condition β: For any triplet Wx, Wy, Wz of welfare levels, x > y > z, and any number of lives n > 0, there is a number of lives m > n such that if A⊂Wx, N(A)=n, B⊂Wz, N(B)=m, and C⊂Wy, N(C)=m+n, then, for any D⊂R(z, y+1), C∪D is at least as good as A∪B∪D, other things being equal."
