[[readings]]
principle = "arrhenius-1999:categories"
work = "arrhenius-1999-weak-ordering"
printed_page = "12-14"
name = "Assumptions and Definitions"
excerpt = "Let's define populations A, B, C,… as finite sets of possible lives. A population is a set of lives under the restriction that one and the same person only occurs once in one and the same population. Unions of populations are also populations given that the aforementioned restriction is satisfied. Notice that although we have assumed that every possible population is of finite size, we haven't assumed that there is a largest possible population. More exactly, we shall assume that for any possible population with a certain welfare, there is a larger possible population with the same welfare. The number of lives in a population – the population size – is denoted by a subscript: h, i, j, k, m, and n for variables and p, q, r, s and t for constants. For example, A_p denotes a population with p members. We shall use the corresponding lower-case letters to denote the members of a population: a_1, a_2,…a_i,…a_p, denotes members of population A_p, b_1, b_2,…b_i,...b_p, members of population B_p, and so forth. [p. 13] We shall assume that there are possible lives with positive or negative welfare. Furthermore, we assume that there are possible lives with very high positive welfare, very low positive welfare or slightly negative welfare. … Notice that we are not assuming that the above partitions of possible lives are exhaustive. There might, of course, be lives with neutral welfare but also some peculiar lives that cannot be grouped into any of these sets. Let's define W_pw as the set of all lives with positive welfare, W_nw as the set of all lives with negative welfare, W_vhp as the set of all lives with very high positive welfare, W_vlp as the set of all lives with very low positive welfare, W_sn as the set of all lives with slightly negative welfare. … We shall assume that there are subsets of W_vhp and W_vlp which are ordered by the \"has at least as high welfare as\" relation. Let's define W_vlp1, W_vlp2, and W_vlp3 as three subsets of W_vlp such that in each of these subsets, all lives have the same welfare and lives belonging to W_vlp3 have higher welfare than lives belonging to W_vlp2 who in turn have higher welfare than lives belonging to W_vlp1. [p. 14] We shall understand a population axiology as a quasi-ordering of logically possible populations. In other words, we assume that the relation \"is at least as good as\" should be reflexive, transitive but not necessarily complete over the set of all logically possible populations."
formal_reading = "n/a (definitions) :: n/a ⟹ n/a"
