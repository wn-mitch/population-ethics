name = "Lemma 5.1"
excerpt = "Lemma 5.1: The Non-Elitism Condition implies Condition β:\n\nCondition β: For any triplet W_x, W_y, W_z of welfare levels, x > y > z, and any number of lives n > 0, there is a number of lives m > n such that if A⊂W_x, N(A)=n, B⊂W_z, N(B)=m, and C⊂W_y, N(C)=m+n, then, for any D⊂R(z, y+1), C∪D is at least as good as A∪B∪D, other things being equal.\n\n[Sub-lemmas, source numbering:] Lemma 5.1.1: The Non-Elitism Condition entails Condition α. Condition α: For any welfare levels W_x, W_y, x-1 > y, and for any number of lives n > 0, there is a number of lives m ≥ n such that if A⊂W_x, N(A)=n, B⊂W_y, N(B)=m, C⊂W_{x-1}, N(C)=m+n, then, for any D⊂R(y, x), C∪D is at least as good as A∪B∪D, other things being equal. Lemma 5.1.2: Condition α entails Condition β."
