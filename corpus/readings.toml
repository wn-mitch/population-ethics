informal_excerpt = "The Egalitarian Dominance Condition: If population A is a perfectly equal population of the same size as population B, and every person in A has higher welfare than every person in B, then A is better than B, other things being equal. (p. 156; the same wording appears at p. 51 [pdf 60], §3.2)"
