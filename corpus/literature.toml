[[works]]
id = "arrhenius-1999-weak-ordering"
kind = "arrhenius-theorem"
citation = "Gustaf Arrhenius, An Impossibility Theorem in Population Axiology with Weak Ordering Assumptions, in R. Sliwinski (ed.), Philosophical Crumbs, Uppsala Philosophical Studies 49, 11–21 (1999)."
stable_url = "https://philpapers.org/rec/ARRAIT-2"
pdf_url = "https://www.iffs.se/media/2265/an-impossibility-theorem-in-population-axiology-with-weak-ordering-assumptions-i-henschens-festskrift.pdf"
pdf_sha256 = "771c224a983c2e09d19d91b1dddfcab09a70487d434b3025a1218d3ff1fd7b3b"
read = "firsthand"
ordering = "Quasi-ordering: reflexive, transitive, not necessarily complete (p. 14)."
conditions = [
  "Quality Addition (p. 15): some very-high A_n makes A_n ∪ C_k at least as good as B_m ∪ C_k for every very-low B_m.",
  "Minimal Inequality Aversion (p. 15): an ordinal, at-least-as-good replacement for Non-Anti-Egalitarianism.",
  "Non-Sadism (p. 16): adding positive lives is at least as good as adding negative lives, on any background.",
  "Minimal Non-Extreme Priority (p. 16): n very-high lives plus one slightly negative life are at least as good as n+1 very-low lives, on any background D_k.",
  "Egalitarian Dominance (p. 17): the only strict condition.",
]
theorem = "There is no population axiology which satisfies the Dominance, the Minimal Inequality Aversion, the Minimal Non-Extreme Priority, the Non-Sadism, and the Quality Addition Condition. (p. 17)"
proof_skeleton = [
  "MNEP on background A_p: A_p ∪ A'_q ∪ E_1 ⪰ A_p ∪ B_{q+1}.",
  "Quality Addition on background B_{q+1}: A_p ∪ B_{q+1} ⪰ B_{q+1} ∪ C_{p+r-1}.",
  "Egalitarian Dominance: B_{q+1} ∪ C_{p+r-1} ≻ G_{p+q+r}; transitivity gives A_p ∪ A'_q ∪ E_1 ≻ G.",
  "Minimal Inequality Aversion: G ⪰ A_p ∪ A'_q ∪ F_r.",
  "Non-Sadism on background A_p ∪ A'_q: A_p ∪ A'_q ∪ F_r ⪰ A_p ∪ A'_q ∪ E_1; transitivity contradicts step 3.",
  "No completeness; transitivity twice. Diagram 1 misprints C_{p+r-1} as C_{q+r-1}.",
]
notes = [
  "p. 12 names the complete-comparability assumption of the 1998 mimeo (the E&P 2000 theorem) as a drawback and presents this theorem as leaving room for incomparability.",
  "fn 3 (p. 11) restates E&P Non-Anti-Egalitarianism in positive at-least-as-good form.",
  "p. 19: holds on ordinal, interval, or ratio scales as long as very-high and very-low lives are ordered.",
]

[[works]]
id = "arrhenius-2000-thesis"
kind = "arrhenius-theorem"
citation = "Gustaf Arrhenius, Future Generations: A Challenge for Moral Theory, PhD dissertation, Uppsala University (2000)."
stable_url = "https://philpapers.org/rec/ARRFGA"
pdf_url = "https://www.iffs.se/media/23529/fulltext01.pdf"
pdf_sha256 = "3b3a12c25cf33611726bfd4197cafb99a26c179ca6583c8ecfda8e8c4e7f28b0"
errata_url = "https://www.iffs.se/media/2267/errata.pdf"
errata_sha256 = "542fcc8c054d093c11476db3acd81ae588efb550d147f892d5272584046c543b"
read = "firsthand"
ordering = "Quasi-ordering of populations and of lives (§2.4 pp. 36–37, §10.2 p. 152). Discreteness supplies consecutive levels; very high and very low are non-fixed ranges R(u,v) and R(1,y), u > y (pp. 153–157)."
theorems = [
  "Theorem 1 (§10.4, p. 157): Egalitarian Dominance + Quantity + Quality are inconsistent. A one-level-at-a-time Quantity chain closed by Egalitarian Dominance.",
  "Theorem 2 (§10.6, pp. 159–161): Dominance Addition + Inequality Aversion + Egalitarian Dominance + Quality are inconsistent.",
  "Theorem 3 (§10.8, pp. 163–165): Egalitarian Dominance + Inequality Aversion + Non-Sadism + Non-Extreme Priority + Weak Quality Addition are inconsistent. Same skeleton as the 1999 theorem, with populations A, H, E, B, F, G, C.",
  "Theorem 4 (§10.10, pp. 167–180): Egalitarian Dominance + Non-Elitism + General Non-Extreme Priority + Weak Non-Sadism + Weak Quality Addition are inconsistent. Lemma 5.1 (Non-Elitism implies background-robust Inequality Aversion) and Lemma 5.2 (GNEP implies Condition δ) chain small steps; Lemma 5.3 reruns the Theorem 3 skeleton with m negative lives.",
  "Theorems 5 and 6 (§11.3–11.6, pp. 191–198): normative versions of Theorems 2 and 3 using Separate Satisfiability; no transitivity or completeness.",
]
notes = [
  "No theorem in chapters 10–11 uses completeness; all conditions except Egalitarian Dominance are in at-least-as-good form.",
  "pp. 182–183: the cycles are weak links closed by one strict link; stating the conditions with better-than yields strict cycles, so consequentialism needs some acyclicity (fn 3).",
  "pp. 200–201: rejects Parfit's proposal to quarantine the theorems to different-number cases.",
]

