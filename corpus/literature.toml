[[works]]
id = "arrhenius-2003-vrc"
kind = "arrhenius-theorem"
citation = "Gustaf Arrhenius, The Very Repugnant Conclusion, in K. Segerberg & R. Sliwinski (eds.), Logic, Law, Morality, Uppsala Philosophical Studies 51, 167–180 (2003)."
stable_url = "https://philpapers.org/rec/ARRTVR"
pdf_url = "http://web.archive.org/web/20060506080047id_/http://people.su.se:80/~guarr/Texter/The%20Very%20Repugnant%20Conclusion%20i%20%c5kvists%20festskrift.pdf"
pdf_sha256 = "9522c09e45c6f527b1d27dddfd8498fc74e8ac58ca13bc9da2a28619a86c56da"
read = "firsthand"
ordering = "Quasi-ordering (p. 169)."
theorem = "There is no population axiology which satisfies the Egalitarian Dominance, the Non-Elitism, the General Non-Extreme Priority, Avoidance of the Very Repugnant Conclusion, and the Dominance Addition Condition. (p. 173)"
proof_skeleton = [
  "Egalitarian Dominance: A2 ≻ A1.",
  "Dominance Addition: A3 ∪ B1 ∪ C1 ∪ D1 ⪰ A2.",
  "Condition δ (from GNEP) on background A3 ∪ C1: A3 ∪ B2 ∪ C1 ∪ D2 ⪰ A3 ∪ B1 ∪ C1 ∪ D1, where D2 is m negative lives.",
  "Condition β (from Non-Elitism): A4 ∪ B3 ∪ C2 ∪ D2 ⪰ A3 ∪ B2 ∪ C1 ∪ D2.",
  "Avoidance of the VRC: A1 ⪰ A4 ∪ B3 ∪ C2 ∪ D2; transitivity closes the cycle. No completeness.",
]
notes = ["The negative lives D2 stay inside the low side of the quality-type condition, as in R6's Addition instance."]

