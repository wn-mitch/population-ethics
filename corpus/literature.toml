known = "Under full comparability the bounce theorem is thesis Theorem 1 plus Appendix B (pp. 205–206), which derives Quality from Egalitarian Dominance and a size-restricted avoidance of the Repugnant Conclusion. Every restatement of Theorem 1 checked keeps unrestricted Quality (Thomas 2016 p. 4; Thomas 2018 pp. 6–7; Thornley 2022; Arrhenius & Stefánsson 2025 p. 845). Chain arguments in the superiority literature grow populations by Addition, Separability or Scaling, not by alternating Quantity and Egalitarian Dominance. Arrhenius's derivation of Restricted Quality Addition (2011 Lemma 1.3) contains an error (Thomas 2018 fn. 4); Thornley 2022 fn. 7 repairs Weak Quality Addition by making its witnesses independent of the background."
open = "The completeness-free result: the Quantity/Egalitarian Dominance bounce that grows the low population past the size threshold without full comparability, found in none of the works checked. The corollary (Egalitarian Dominance, GNEP, Quantity, 2009 Weak Quality Addition) holds for Weak Quality Addition in Thornley's repaired form, which is the ladder's encoding; the source's form inherits the Lemma 1.3 gap. Not read: Arrhenius's forthcoming book, Arrhenius 2016 (Theoria), Jensen 2008/2020, Handfield & Rabinowicz 2018, Arrhenius & Rabinowicz 2005."

