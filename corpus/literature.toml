known = "The original five-condition impossibility is the published 2003 theorem. The thesis gives the ranged-background Non-Elitism and N-shaped not-worse Dominance Addition readings used here; its Fourth Theorem has different premises, Weak Non-Sadism and Weak Quality Addition, and does not include Dominance Addition. Thomas 2016 distinguishes the weaker DA and, with unrestricted GNE, derives low not-at-least-as-good as high: this is not the negation of the 2003 avoidance requirement high at-least-as-good as low in an incomplete ordering. Thomas 2018's total lexic utilitarianism escapes the fifth theorem by dropping Small Steps on an infinite welfare order. Cato 2025 constructs an acyclic choice model for the Mere Addition Paradox; Francis 2026 proves a different additive impossibility. None of these checked works gives the exact P21 integer-chain least-preorder model."
open = "P21 realizes the both-weakened conditions on every finite multiset, including the empty population, over one source-permitted unbounded integer welfare chain. It does not extend to arbitrary richer welfare quasi-orders with off-chain levels, imply a model for either singly weakened set, or guarantee that the chosen W_-1 captures an adequate 'very negative' life. The model uses the transitive-closure method already in D-019; novelty of the exact conjunction remains unchecked. Full texts of Jensen 2008/2020, Handfield and Rabinowicz 2018, Arrhenius and Rabinowicz 2005, and the later Arrhenius book were not obtained; independent publication of an equivalent result remains unchecked."
