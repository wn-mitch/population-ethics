pdf_sha256 = "78bc3339933551219748f437d2434698627719dc0805cb4c85122b30293c3127"
read = "firsthand"
notes = [
  "Bounce theorem (P13) check, 2026-09: none-found. Theorem 1 (p. 4) is 'ED and Q jointly entail RC' with unrestricted Quality; the closest size device is Restricted Repugnant Addition (p. 11), whose large N comes from Weak Non-Sadism's free parameter, not a bounce.",
  "Reconstructs the six book theorems from the 2013 manuscript over a transitive, reflexive relation, with positive-form conditions (p. 2).",
  "Shared lemmas: General Non-Elitism implies Generalized Inequality-Averse Addition (pp. 6–8); GNEP implies Sufficient Tradeoffs (pp. 8–9).",
  "pp. 4–5, 10: negative-form Dominance Addition yields only 'not at least as good'.",
  "P21 check: p. 1 works with a finite welfare set; pp. 4–5 and 10 distinguish Arrhenius's not-better DA from positive weak DA. With weak DA, p. 10 derives that low is not at least as good as high, violating Thomas's Weak Quality Condition. This does not negate the 2003 avoidance condition that high is at least as good as low in an incomplete quasi-order, nor provide the P21 model.",
  "Theorem 3 (p. 6) is the closest reconstructed skeleton to R6.",
  "Does not reconstruct the E&P 2000 theorem.",
]

