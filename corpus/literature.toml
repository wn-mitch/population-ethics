known = "The primitive chosen-witness control is a re-expansion of published material, not a new result: 2003 Lemma 1.1 (n Non-Elitism applications give Condition α with m = n·p) and Lemma 1.2 (r = x−y applications of α with m_i ≥ f(m_{i−1}) give Condition β) on pp. 174–177, and thesis Lemma 5.2.1 (r = 3−z GNEP applications at W_{z+(i−1)}, χ's n = Σ n_i) and Lemma 5.2.2 (m copies of χ, so δ's n = m·n_χ) on pp. 173–177, which is why the control's β run has 35 Non-Elitism edges at n = 5 and its δ run exactly four GNEP edges at z = −1, m = 1 with δ's n = 4. The project records the same contractions once as the realizations non-elitism-to-beta and gnep-to-delta (D-011, D-017). Arrhenius 2001 (Österberg volume) is the published source for the Non-Elitism and GNEP lemma proofs the 2003 paper cites. Thomas 2016 (pp. 4–5, 10) notes only that the negative-form Dominance Addition yields 'not at least as good'."
open = "No checked source states a strengthened 2003 theorem. Ranged Non-Elitism (thesis p. 166 restricts D to R(y, x)) and the thesis not-worse Dominance Addition (p. 159, C perfectly equal at one positive level) appear together with GNEP and VRC avoidance in none of the works read. The P18 primitive control and its two-cap search are a finite fixed-witness diagnostic: a chosen-witness expansion, a bounded SAT/UNSAT table, and an absent cycle are not consistency or impossibility evidence for the unrestricted conditions, so Q-011 stays open. Outstanding: the forthcoming book, Arrhenius 2016, Jensen 2008/2020, Handfield & Rabinowicz 2018, and Arrhenius & Rabinowicz 2005."

