[project]
name = "population-ethics"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pynauty>=2.8.8.1",
    "typer>=0.27.2",
    "z3-solver>=5.1.0.0",
]

[project.scripts]
population-ethics = "population_ethics.cli:app"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Phase scripts carry long human-readable ledger prose in string literals.
"research/p*_*.py" = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
